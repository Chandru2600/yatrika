# Render Blueprint Specification
services:
  - type: web
    name: travel-planner-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT "app:create_app('production')"
    disk:
      name: sqlite-db
      mountPath: /opt/render/project/src/backend/database
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
      - key: IBM_API_KEY
        sync: false # User will fill this in Render UI
      - key: IBM_PROJECT_ID
        sync: false # User will fill this in Render UI
      - key: IBM_WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: GRANITE_MODEL_ID
        value: ibm/granite-4-h-small
      - key: WEATHER_API_KEY
        sync: false # User will fill this in Render UI

